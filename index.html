<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI CALCULADORA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1><b><u>CALCULADORA</u></b></h1>

    <img src="calculadora.avif" alt="imagem-fundo">

    <div class="input">
        <input type="number" id="input1" placeholder="Número 1">
        <input type="number" id="input2" placeholder="Número 2">

        <div class="button">
            <button id="btnAdicao" onclick="escolherOperacao('+')"> + </button>
            <button id="btnSubtracao" onclick="escolherOperacao('-')"> - </button>
            <button id="btnMultiplicacao" onclick="escolherOperacao('*')"> x </button>
            <button id="btnDivisao" onclick="escolherOperacao('/')"> ÷ </button>
            <button id="btnIgual" onclick="calcular()"> = </button>
        </div>

    </div>

    <p class="result"><u>Resultado:</u></p>
    <b>
        <p class="resultado"></p>
    </b>

    <script src="calculadora.js"></script>
</body>

</html>
